<script>
    const UIT_VIGENTE = 5500;
    const container = document.getElementById('inquilinos-container');

    // =========================================================================
    // MODO OSCURO (THEME TOGGLE)
    // =========================================================================
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('themeLuz', newTheme);
        actualizarIconoTema(newTheme);
    }

    function actualizarIconoTema(theme) {
        const btn = document.getElementById('btn-theme-toggle');
        if (theme === 'dark') {
            btn.innerHTML = `<i class="bi bi-sun-fill"></i> <span>Claro</span>`;
        } else {
            btn.innerHTML = `<i class="bi bi-moon-stars-fill"></i> <span>Oscuro</span>`;
        }
    }
    window.addEventListener('DOMContentLoaded', () => actualizarIconoTema(document.documentElement.getAttribute('data-theme')));
    
    function parseDateLocal(dStr) {
        if(!dStr) return null;
        const d = new Date(dStr + 'T00:00:00');
        return isNaN(d) ? null : d;
    }

    // =========================================================================
    // FUNCIONES: GUARDAR Y CARGAR ESTADO (SESIÓN) PARA LUZ
    // =========================================================================

    function guardarEstadoAppLuz() {
        exportarJSON();
    }

    async function descargarArchivo(datos, nombreArchivo) {
        const jsonString = JSON.stringify(datos, null, 2);
        
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
            try {
                const { Filesystem, Share } = window.Capacitor.Plugins;
                const base64Data = btoa(unescape(encodeURIComponent(jsonString)));
                const savedFile = await Filesystem.writeFile({ path: nombreArchivo, data: base64Data, directory: 'CACHE' });
                await Share.share({ title: nombreArchivo, url: savedFile.uri, dialogTitle: 'Guardar o Compartir JSON' });
                return;
            } catch (err) { console.error('Error con Capacitor Share:', err); }
        }

        const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
        const file = new File([blob], nombreArchivo, { type: 'application/json' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                await navigator.share({ files: [file], title: 'Respaldo JSON de Luz', text: nombreArchivo });
                return;
            } catch (error) { console.error('Error compartiendo vía Web Share API:', error); }
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = nombreArchivo;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function cargarEstadoAppLuz(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const datos = JSON.parse(e.target.result);

                if (datos && typeof datos === 'object' && !Array.isArray(datos) && datos.schema === 'luz_cayran_unificado' && datos.estado_app) {
                    cargarEstadoLegacyLuz(datos.estado_app);
                    const mesTxt = String(datos.mes_cobro || datos.mes || '').trim().toUpperCase();
                    alert(`¡JSON único${mesTxt ? ' (' + mesTxt + ')' : ''} restaurado correctamente!`);
                } else if (Array.isArray(datos)) {
                    cargarExportacionCompletaLuz(datos);
                } else if (datos && typeof datos === 'object') {
                    cargarEstadoLegacyLuz(datos);
                    alert("¡Datos de sesión antiguos restaurados correctamente!");
                } else { throw new Error("Formato JSON no reconocido."); }
                event.target.value = "";
            } catch (error) {
                alert("Error al leer el archivo JSON. Asegúrate de que sea un archivo generado por Luz Cayrán.");
                console.error(error); event.target.value = "";
            }
        };
        reader.readAsText(file);
    }

    function cargarEstadoLegacyLuz(estado) {
        if (estado['num_medidores'] !== undefined) document.getElementById('num_medidores').value = estado['num_medidores'];
        if (estado['has_sin_medidor'] !== undefined) document.getElementById('has_sin_medidor').checked = estado['has_sin_medidor'];
        actualizarVista();

        for (const id in estado) {
            const elemento = document.getElementById(id);
            if (elemento && id !== 'num_medidores' && id !== 'has_sin_medidor') {
                if (elemento.type === 'checkbox') elemento.checked = estado[id];
                else elemento.value = estado[id];
            }
        }

        for (let i = 2; i <= 5; i++) { if (document.getElementById(`modo_dias_i${i}`)) toggleModoDias(i, false); }
        calculate();
    }

    function cargarExportacionCompletaLuz(datos) {
        const metadata = datos.find(r => r && r.tipo_registro === 'metadata') || null;
        const reciboPrincipal = datos.find(r => r && r.tipo_registro === 'recibo_principal') || null;
        const inquilinos = datos.filter(r => r && r.tipo_registro === 'inquilino');

        if (!reciboPrincipal || inquilinos.length === 0) throw new Error("Este JSON no contiene el recibo principal y los inquilinos necesarios.");

        const conMedidor = inquilinos.filter(r => r.con_medidor !== false);
        const sinMedidor = inquilinos.find(r => r.con_medidor === false) || null;

        let numMedidores = metadata && metadata.configuracion ? parseInt(metadata.configuracion.num_medidores) : conMedidor.length;
        if (!Number.isFinite(numMedidores)) numMedidores = conMedidor.length;
        numMedidores = Math.min(4, Math.max(1, numMedidores || 1));

        let hasSinMedidor = (metadata && metadata.configuracion && typeof metadata.configuracion.inquilino_sin_medidor === 'boolean') ? metadata.configuracion.inquilino_sin_medidor : !!sinMedidor;

        document.getElementById('num_medidores').value = String(numMedidores);
        document.getElementById('has_sin_medidor').checked = hasSinMedidor;
        actualizarVista();

        const mesImportado = (metadata && (metadata.mes_cobro || metadata.mes || (metadata.periodo && metadata.periodo.mes))) || reciboPrincipal.mes_cobro || reciboPrincipal.mes || (inquilinos[0] && (inquilinos[0].mes_cobro || inquilinos[0].mes)) || '';
        if (mesImportado) {
            const selectMes = document.getElementById('mes_principal');
            const mesNormalizado = String(mesImportado).trim().toUpperCase();
            const opcion = Array.from(selectMes.options).find(opt => opt.value.toUpperCase() === mesNormalizado || opt.text.toUpperCase() === mesNormalizado);
            if (opcion) selectMes.value = opcion.value;
        }

        const lecturasM = reciboPrincipal.lecturas || {}; const importesM = reciboPrincipal.importes || {};

        asignarValorLuz('lec_ant_m', lecturasM.lectura_anterior); asignarValorLuz('lec_act_m', lecturasM.lectura_actual);
        asignarValorLuz('fec_ant_m', lecturasM.fecha_lectura_anterior || reciboPrincipal.fecha_inicio || '');
        asignarValorLuz('fec_act_m', lecturasM.fecha_lectura_actual || reciboPrincipal.fecha_fin || '');
        asignarValorLuz('tarifa', reciboPrincipal.tarifa_kwh); asignarValorLuz('rep_m', importesM.reposicion_mantenimiento);
        asignarValorLuz('cargo_fijo_m', importesM.cargo_fijo); asignarValorLuz('alum_m', importesM.alumbrado_publico);
        asignarValorLuz('int_m', importesM.interes_compensatorio); asignarValorLuz('red_ant_m', importesM.redondeo_anterior);
        asignarValorLuz('red_act_m', importesM.redondeo_actual);

        for (let i = 2; i <= 5; i++) {
            asignarValorLuz(`titulo_i${i}`, ''); asignarValorLuz(`lec_ant_i${i}`, ''); asignarValorLuz(`lec_act_i${i}`, '');
            asignarValorLuz(`fec_ant_i${i}`, ''); asignarValorLuz(`fec_act_i${i}`, '');
            asignarValorLuz(`modo_dias_i${i}`, 'recibo'); asignarValorLuz(`dias_vividos_i${i}`, '');
        }
        asignarValorLuz('titulo_i1', ''); if (hasSinMedidor && sinMedidor) asignarValorLuz('titulo_i1', sinMedidor.nombre || 'Inquilino sin medidor');

        conMedidor.forEach((inq, indice) => {
            let i = parseInt(inq.id_interno);
            if (!Number.isFinite(i) || i < 2 || i > 5) i = indice + 2;
            if (i > 5) return;
            const lecturas = inq.lecturas || {};
            asignarValorLuz(`titulo_i${i}`, inq.nombre || `Inquilino ${i - 1}`);
            asignarValorLuz(`lec_ant_i${i}`, lecturas.lectura_anterior); asignarValorLuz(`lec_act_i${i}`, lecturas.lectura_actual);
            asignarValorLuz(`fec_ant_i${i}`, lecturas.fecha_lectura_anterior || ''); asignarValorLuz(`fec_act_i${i}`, lecturas.fecha_lectura_actual || '');
            const modo = inq.modo_dias === 'manual' ? 'manual' : 'recibo';
            asignarValorLuz(`modo_dias_i${i}`, modo);
            if (inq.dias_facturados !== undefined && inq.dias_facturados !== null) asignarValorLuz(`dias_vividos_i${i}`, inq.dias_facturados);
            toggleModoDias(i, false);
        });

        calculate();
        const mesTexto = mesImportado ? ` (${String(mesImportado).toUpperCase()})` : '';
        alert(`¡Archivo completo de LUZ${mesTexto} restaurado correctamente!`);
    }

    function asignarValorLuz(id, valor) {
        if (valor === undefined || valor === null) return;
        const elemento = document.getElementById(id);
        if (!elemento) return;
        if (elemento.type === 'checkbox') elemento.checked = !!valor; else elemento.value = valor;
    }

    // =========================================================================
    // FUNCIONES: ROTACIÓN DE CICLO
    // =========================================================================

    function avanzarCicloPrincipal() {
        if(confirm("¿Pasar la lectura y fecha actual del RECIBO PRINCIPAL a los campos anteriores? Los actuales quedarán en blanco.")) {
            const lecAct = document.getElementById('lec_act_m'); const lecAnt = document.getElementById('lec_ant_m');
            if(lecAct && lecAnt) { lecAnt.value = lecAct.value; lecAct.value = ''; }
            const fecAct = document.getElementById('fec_act_m'); const fecAnt = document.getElementById('fec_ant_m');
            if(fecAct && fecAnt) { fecAnt.value = fecAct.value; fecAct.value = ''; }
            calculate();
        }
    }

    function avanzarCicloInquilino(id) {
        const nombreInq = document.getElementById(`titulo_i${id}`).value || `Inquilino ${id-1}`;
        if(confirm(`¿Pasar datos actuales de "${nombreInq.toUpperCase()}" a anteriores?`)) {
            const lecAct = document.getElementById(`lec_act_i${id}`); const lecAnt = document.getElementById(`lec_ant_i${id}`);
            if(lecAct && lecAnt) { lecAnt.value = lecAct.value; lecAct.value = ''; }
            const fecAct = document.getElementById(`fec_act_i${id}`); const fecAnt = document.getElementById(`fec_ant_i${id}`);
            if(fecAct && fecAnt) { fecAnt.value = fecAct.value; fecAct.value = ''; }
            calculate();
        }
    }

    // =========================================================================

    function generarTarjetaInquilino(id, titulo, colorBorde, modoDefault) {
        return `
        <div class="panel" id="recibo_i${id}" style="border-top: 4px solid ${colorBorde};">
            <div class="header-card">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <input type="text" id="titulo_i${id}" class="titulo-editable flex-grow-1" placeholder="${titulo}" style="color:${colorBorde}; min-width: 200px;" oninput="sincronizarNombre(${id})">
                    <div class="btn-group flex-nowrap" style="width: auto;">
                        <button class="btn-pill btn-secondary-custom btn-sm px-3" onclick="toggleCardBody(${id})" title="Ocultar/Mostrar"><i class="bi bi-eye-fill"></i></button>
                        <button class="btn-pill btn-danger-custom btn-sm px-3" onclick="limpiarInquilino(${id})" title="Borrar datos"><i class="bi bi-trash-fill"></i></button>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3 flex-wrap">
                    <button class="btn-pill flex-grow-1" style="background:#25D366; color:white;" onclick="generarImagenRecibo(${id})">
                        <i class="bi bi-whatsapp"></i> <span>Recibo</span>
                    </button>
                    <button class="btn-pill btn-primary-custom flex-grow-1" onclick="generarImagenCalculos(${id})">
                        <i class="bi bi-calculator-fill"></i> <span>Cálculos</span>
                    </button>
                </div>
            </div>
            <div id="body_i${id}">
                <div class="panel-title"><i class="bi bi-speedometer2"></i> 1. Datos de Lectura</div>
                <div class="grid-2">

    function calculate() {
        const factorLey = (2 * UIT_VIGENTE) / 1000000;
        document.getElementById('detalle_factor').innerText = factorLey.toFixed(6);
        const numMedidores = parseInt(document.getElementById('num_medidores').value) || 0;
        const hasSinMedidor = document.getElementById('has_sin_medidor').checked;
        const totalInquilinosReales = numMedidores + (hasSinMedidor ? 1 : 0);
        const n = totalInquilinosReales > 0 ? totalInquilinosReales : 1; 
        const t = getVal('tarifa');

        const f1m_val = document.getElementById('fec_act_m').value;
        const f2m_val = document.getElementById('fec_ant_m').value;
        const d_f1m = parseDateLocal(f1m_val);
        const d_f2m = parseDateLocal(f2m_val);
        const dm = (d_f1m && d_f2m) ? Math.max(1, Math.floor((d_f1m - d_f2m) / 864e5) + 1) : 0;

        const km = Math.max(0, getVal('lec_act_m') - getVal('lec_ant_m'));
        const aporteLeyPrincipal = km * factorLey;
        setVal('aporte_ley_m', aporteLeyPrincipal, 2);

        const sm = getVal('rep_m') + getVal('cargo_fijo_m') + (km * t) + getVal('alum_m') + getVal('int_m');
        const totalPagarM = sm + (sm * 0.18) + aporteLeyPrincipal + getVal('red_ant_m') + getVal('red_act_m');
        setVal('total_pagar_m', totalPagarM);

        let sumaKwhInquilinosMedidorReal = 0;

        for (let i = 2; i <= 5; i++) {
            if ((i - 1) > numMedidores) { setVal(`total_pagar_i${i}`, 0); continue; }
            const f1i = document.getElementById(`fec_act_i${i}`).value;
            const f2i = document.getElementById(`fec_ant_i${i}`).value;
            const di_lectura = (f1i && f2i) ? Math.max(1, Math.floor((new Date(f1i+'T00:00:00') - new Date(f2i+'T00:00:00')) / 864e5) + 1) : 0;
            const ki = Math.max(0, getVal(`lec_act_i${i}`) - getVal(`lec_ant_i${i}`));
            const kd = di_lectura > 0 ? (ki / di_lectura) : 0;

            const modo = document.getElementById(`modo_dias_i${i}`).value;
            let dias_facturar = modo === 'recibo' ? dm : getVal(`dias_vividos_i${i}`);
            if (modo === 'recibo') document.getElementById(`dias_vividos_i${i}`).value = dm;
            
            sumaKwhInquilinosMedidorReal += (kd * dias_facturar);

            const en_i = (dias_facturar > 0) ? (kd * dias_facturar * t) : 0;
            const ap_i = (dias_facturar > 0) ? (kd * dias_facturar * factorLey) : 0;
            const rep_i = (dm > 0 && n > 0) ? (getVal('rep_m') / dm / n) * dias_facturar : 0;
            const cf_i = (dm > 0 && n > 0) ? (getVal('cargo_fijo_m') / dm / n) * dias_facturar : 0;
            const alum_i = (dm > 0 && n > 0) ? (getVal('alum_m') / dm / n) * dias_facturar : 0;
            const int_i = (dm > 0 && n > 0) ? (getVal('int_m') / dm / n) * dias_facturar : 0;
            const red_ant_i = (dm > 0 && n > 0) ? (getVal('red_ant_m') / dm / n) * dias_facturar : 0;
            const red_act_i = (dm > 0 && n > 0) ? (getVal('red_act_m') / dm / n) * dias_facturar : 0;

            const sub_i = en_i + rep_i + cf_i + alum_i + int_i;
            setVal(`ener_i${i}`, en_i); setVal(`rep_i${i}`, rep_i); setVal(`cf_i${i}`, cf_i);
            setVal(`alum_i${i}`, alum_i); setVal(`int_i${i}`, int_i); setVal(`igv_i${i}`, sub_i * 0.18);
            setVal(`aporte_i${i}`, ap_i); setVal(`red_ant_i${i}`, red_ant_i); setVal(`red_act_i${i}`, red_act_i);

            const total_i = sub_i + (sub_i * 0.18) + ap_i + red_ant_i + red_act_i;
            setVal(`total_pagar_i${i}`, total_i);
        }

        if (hasSinMedidor) {
            const kwhDiferencia = Math.max(0, km - sumaKwhInquilinosMedidorReal);
            const en_i1 = kwhDiferencia * t;
            
            const rep_i1_val = (dm > 0 && n > 0) ? (getVal('rep_m') / dm / n) * dm : (getVal('rep_m') / n);
            const cf_i1_val = (dm > 0 && n > 0) ? (getVal('cargo_fijo_m') / dm / n) * dm : (getVal('cargo_fijo_m') / n);
            const alum_i1_val = (dm > 0 && n > 0) ? (getVal('alum_m') / dm / n) * dm : (getVal('alum_m') / n);
            const int_i1_val = (dm > 0 && n > 0) ? (getVal('int_m') / dm / n) * dm : (getVal('int_m') / n);
            const red_ant_i1_val = (dm > 0 && n > 0) ? (getVal('red_ant_m') / dm / n) * dm : (getVal('red_ant_m') / n);
            const red_act_i1_val = (dm > 0 && n > 0) ? (getVal('red_act_m') / dm / n) * dm : (getVal('red_act_m') / n);
            const ap_i1_val = kwhDiferencia * factorLey;

            const sub_i1 = en_i1 + rep_i1_val + cf_i1_val + alum_i1_val + int_i1_val;
            const igv_i1 = sub_i1 * 0.18;
            const total_i1 = sub_i1 + igv_i1 + ap_i1_val + red_ant_i1_val + red_act_i1_val;

            window._i1_cache = { kwh: kwhDiferencia, ener: en_i1, rep: rep_i1_val, cf: cf_i1_val, alum: alum_i1_val, int: int_i1_val, igv: igv_i1, aporte: ap_i1_val, red_ant: red_ant_i1_val, red_act: red_act_i1_val, total: total_i1 };
            setVal('total_pagar_i1', total_i1);
        }

        const btnResumen = document.getElementById('btn-descargar-resumen');
        if (verificarDatosCompletos()) { btnResumen.style.display = 'inline-flex'; } else { btnResumen.style.display = 'none'; }
    }

    async function capturarYCompartir(elementId, nombreArchivo, title, text) {
        const tempCont = document.getElementById('pdf-template-container');
        try {
            const canvas = await html2canvas(document.getElementById(elementId), { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
            const base64Uri = canvas.toDataURL('image/png');
            
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
                try {
                    const { Filesystem, Share } = window.Capacitor.Plugins;
                    const base64Data = base64Uri.split(',')[1];
                    const savedFile = await Filesystem.writeFile({ path: nombreArchivo, data: base64Data, directory: 'CACHE' });
                    await Share.share({ title: title, text: text, url: savedFile.uri, dialogTitle: 'Compartir Imagen' });
                    tempCont.innerHTML = ''; return; 
                } catch (err) { console.error('Error con Capacitor Share:', err); }
            }

            canvas.toBlob(async (blob) => {
                if (!blob) { tempCont.innerHTML = ''; return; }
                let compartidoNativo = false;
                if (navigator.share) {
                    const file = new File([blob], nombreArchivo, { type: 'image/png' });
                    if (typeof navigator.canShare !== 'function' || navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: title, text: text }); compartidoNativo = true; } 
                        catch (e) { if (e.name === 'AbortError' || e.message.includes('Share canceled')) compartidoNativo = true; }
                    }
                }
                if (!compartidoNativo) {
                    alert("La imagen se descargará para que la puedas enviar manualmente.");
                    const link = document.createElement('a'); link.href = base64Uri; link.download = nombreArchivo;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                }
                tempCont.innerHTML = ''; 
            }, 'image/png');
        } catch (err) { console.error("Error capturando imagen", err); tempCont.innerHTML = ''; alert("Hubo un error al generar la imagen."); }
    }

                    <div class="bloque-paso"><div class="paso-titulo" style="background:${colorTitulo} !important; color:${colorTextoTitulo} !important;">PASO 3: CARGO ENERGÍA</div><div class="pregunta">¿A cuánto dinero equivale ese consumo en el recibo completo?</div><div class="desarrollo" style="border-left-color:${colorFondo};"><div class="formula-box">Fórmula: Consumo Diario × Días a Cobrar × Tarifa</div><div class="linea-operacion">Operación: ${consumo_diario.toFixed(4)} × ${dias_facturar} d. × S/. ${tarifa.toFixed(4)} = <b>S/. ${ener_val} soles.</b></div></div></div>
                    <div class="bloque-paso"><div class="paso-titulo" style="background:${colorTitulo} !important; color:${colorTextoTitulo} !important;">PASO 4: SERVICIOS COMPARTIDOS</div><div class="pregunta">${desc_paso4}</div><div class="desarrollo" style="border-left-color:${colorFondo};"><div class="formula-box">Fórmula: Montos fijos del Recibo ${texto_op_fijo}</div><div class="lista-valores"><div class="fila-valor"><div class="celda-label">• Reposición y Mant.:</div><div class="celda-operacion">S/. ${main_rep.toFixed(2)} ${texto_op_fijo} = S/. ${rep_val}</div></div><div class="fila-valor"><div class="celda-label">• Cargo Fijo:</div><div class="celda-operacion">S/. ${main_cf.toFixed(2)} ${texto_op_fijo} = S/. ${cf_val}</div></div><div class="fila-valor"><div class="celda-label">• Alumbrado Público:</div><div class="celda-operacion">S/. ${main_alum.toFixed(2)} ${texto_op_fijo} = S/. ${alum_val}</div></div><div class="fila-valor"><div class="celda-label">• Interés Compensat.:</div><div class="celda-operacion">S/. ${main_int.toFixed(2)} ${texto_op_fijo} = S/. ${int_val}</div></div><div class="fila-valor"><div class="celda-label">• Redondeo Anterior:</div><div class="celda-operacion">S/. ${main_red_ant.toFixed(2)} ${texto_op_fijo} = S/. ${red_ant_val}</div></div><div class="fila-valor"><div class="celda-label">• Redondeo Actual:</div><div class="celda-operacion">S/. ${main_red_act.toFixed(2)} ${texto_op_fijo} = S/. ${red_act_val}</div></div></div></div></div>
                    <div class="bloque-paso"><div class="paso-titulo" style="background:${colorTitulo} !important; color:${colorTextoTitulo} !important;">PASO 5: APORTE DE LEY</div><div class="desarrollo" style="border-left-color:${colorFondo};"><div class="formula-box">Fórmula: Factor (${factorLey.toFixed(6)}) × Consumo Diario × Días a Cobrar</div><div class="linea-operacion">Operación: ${factorLey.toFixed(6)} × ${consumo_diario.toFixed(4)} × ${dias_facturar} = <b>S/. ${aporte_val} soles.</b></div></div></div>
                    <div class="bloque-paso"><div class="paso-titulo" style="background:${colorTitulo} !important; color:${colorTextoTitulo} !important;">PASO 6: IGV (18%)</div><div class="desarrollo" style="border-left-color:${colorFondo};"><div class="formula-box">Fórmula: 18% × (Energía + Reposición + Cargo Fijo + Alumbrado + Interés)</div><div class="linea-operacion">Operación: S/. ${sub_sin_igv} × 0.18 = <b>S/. ${igv_val} soles.</b></div></div></div>
                    <div class="bloque-paso bloque-total" style="border-color:${colorFondo} !important;"><div class="paso-titulo" style="background:#fef08a !important; color:#854d0e !important;">PASO 7: CUENTA FINAL</div><div class="desarrollo" style="background:#fafafa !important; border-left-color:#f59e0b !important;"><div class="pregunta">Suma total de conceptos calculados:</div><div class="linea-operacion" style="border-top-color:${colorFondo} !important; font-size:1.1rem; color:${colorFondo} !important;">TOTAL A PAGAR POR EL INQUILINO: S/. ${total_pagar} soles.</div></div></div>
                </div>`;
        }

        const nombreArchivoCalc = `CALCULOS LUZ ${mes} - ${nombreInq}.pdf`;
        html2pdf().set({ margin: [10, 10], filename: nombreArchivoCalc, html2canvas: { scale: 2, useCORS: true, scrollY: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).from(document.getElementById('calculos-captura')).outputPdf('datauristring').then(async function(pdfBase64) {
            tempCont.innerHTML = ''; await guardarOCompartirPDF(nombreArchivoCalc, pdfBase64);
        });
    }

    function descargarResumenPDF() {
        const tempCont = document.getElementById('pdf-template-container');
        const mes = document.getElementById('mes_principal').value;
        const numMedidores = parseInt(document.getElementById('num_medidores').value) || 0;
        const hasSinMedidor = document.getElementById('has_sin_medidor').checked;
        
        let f1m_val = document.getElementById('fec_act_m').value; let f2m_val = document.getElementById('fec_ant_m').value;
        let d_f1m = parseDateLocal(f1m_val); let d_f2m = parseDateLocal(f2m_val);
        let dm = (d_f1m && d_f2m) ? Math.max(1, Math.floor((d_f1m - d_f2m) / 864e5) + 1) : 0;

        let filasTabla = '';

        if (hasSinMedidor) {
            const nombreI1 = document.getElementById('titulo_i1').value || 'Inquilino sin medidor';
            const totalI1 = document.getElementById('total_pagar_i1').value || '0.00';
            const c = window._i1_cache || {kwh:0};
            filasTabla += `<tr><td><b>${nombreI1}</b><br><small>Sin medidor (Diferencia)</small></td><td style="text-align:center">${c.kwh.toFixed(2)} kWh</td><td style="text-align:center">${dm} días</td><td style="text-align:right"><b>S/. ${totalI1}</b></td></tr>`;
        }

        for (let i = 2; i <= (numMedidores + 1); i++) {
            const nombreInq = document.getElementById(`titulo_i${i}`).value || `Inquilino ${i-1}`;
            const lAnt = getVal(`lec_ant_i${i}`); const lAct = getVal(`lec_act_i${i}`);
            const f1i = document.getElementById(`fec_act_i${i}`).value; const f2i = document.getElementById(`fec_ant_i${i}`).value;
            const di_lectura = (f1i && f2i) ? Math.max(1, Math.floor((new Date(f1i+'T00:00:00') - new Date(f2i+'T00:00:00')) / 864e5) + 1) : 0;
            const ki = Math.max(0, lAct - lAnt); const kd = di_lectura > 0 ? (ki / di_lectura) : 0;
            const modo = document.getElementById(`modo_dias_i${i}`).value;
            let dias_facturar = modo === 'recibo' ? dm : getVal(`dias_vividos_i${i}`);
            const kwhConsumidoReal = (kd * dias_facturar).toFixed(2);
            const totalInq = document.getElementById(`total_pagar_i${i}`).value || '0.00';
            filasTabla += `<tr><td><b>${nombreInq}</b><br><small>Con medidor</small></td><td style="text-align:center">${kwhConsumidoReal} kWh</td><td style="text-align:center">${dias_facturar} días</td><td style="text-align:right"><b>S/. ${totalInq}</b></td></tr>`;
        }

        tempCont.innerHTML = `
            <div class="modo-recibo" id="resumen-captura">
                <div class="header-pdf" style="border-bottom-color:#8b5cf6;">
                    <div><b style="color:#8b5cf6; font-size:1.6rem">RESUMEN DE CONSUMO DE LUZ</b><br>MES: ${mes}</div>
                    <div class="total-box-pdf" style="background:#8b5cf6;"><small>TOTAL GENERAL</small><br><b style="font-size:1.5rem">S/. ${document.getElementById('total_pagar_m').value}</b></div>
                </div>
                <div style="margin-bottom:15px"><b>ESTADO:</b> Reporte consolidado de cobros por inquilino.</div>
                <table class="tabla-pdf"><thead><tr><th>INQUILINO</th><th style="text-align:center">CONSUMO REAL</th><th style="text-align:center">DÍAS FACTURADOS</th><th style="text-align:right">MONTO A PAGAR</th></tr></thead><tbody>${filasTabla}</tbody></table>
            </div>`;

        const nombreArchivoResumen = `RESUMEN DE LUZ - ${mes}.pdf`;
        html2pdf().set({ margin: [10, 10], filename: nombreArchivoResumen, html2canvas: { scale: 2, useCORS: true, scrollY: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).from(document.getElementById('resumen-captura')).outputPdf('datauristring').then(async function(pdfBase64) {
            tempCont.innerHTML = ''; await guardarOCompartirPDF(nombreArchivoResumen, pdfBase64);
        });
    }

    function limpiarPrincipal() {
        ['lec_ant_m','lec_act_m','fec_ant_m','fec_act_m','tarifa','rep_m','cargo_fijo_m','alum_m','int_m','red_ant_m','red_act_m'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
        calculate();
    }
    function limpiarInquilino(i) {
        if(i === 1) return;
        [`lec_ant_i${i}`, `lec_act_i${i}`, `fec_ant_i${i}`, `fec_act_i${i}`].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
        const selectModo = document.getElementById(`modo_dias_i${i}`);
        if(selectModo) { selectModo.value = 'recibo'; toggleModoDias(i); }
        document.getElementById(`body_i${i}`).style.display = 'block';
        calculate();
    }
    
    toggleModoDias(2, false); toggleModoDias(3, false); toggleModoDias(4, false); toggleModoDias(5, false); actualizarVista(); 
    document.addEventListener('wheel', function(event) { if (document.activeElement.type === 'number') event.preventDefault(); }, { passive: false });


    // =========================================================================
    // SINCRONIZACIÓN AUTOMÁTICA LOCAL - LUZ CAYRÁN
    // Conserva el formulario y deja un resumen listo para Redondeos.
    // =========================================================================
    const STORAGE_LUZ_BORRADOR = 'recibos_cayran_luz_borrador_v1';
    const STORAGE_LUZ_SYNC = 'recibos_cayran_luz_sync_v1';
    let timerAutosaveLuz = null;
    let restaurandoLuzLocal = false;

    function capturarEstadoLocalLuz() {
        const estado = {};
        document.querySelectorAll('input, select').forEach(input => {
            if (input.id && input.type !== 'file' && input.type !== 'button') {
                estado[input.id] = input.type === 'checkbox' ? input.checked : input.value;
            }
        });
        return estado;
    }

    function fechaInicioSyncLuz(fechaFinStr, dias) {
        const fin = parseDateLocal(fechaFinStr);
        const n = Number(dias) || 0;
        if (!fin || n < 1) return '';
        const ini = new Date(fin.getTime() - (n - 1) * 86400000);
        const y = ini.getFullYear();
        const m = String(ini.getMonth() + 1).padStart(2, '0');
        const d = String(ini.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function construirSyncLuz() {
        calculate();

        const fechaFin = document.getElementById('fec_act_m')?.value || '';
        const fechaAnt = document.getElementById('fec_ant_m')?.value || '';
        const dFin = parseDateLocal(fechaFin);
        const dAnt = parseDateLocal(fechaAnt);
        const diasRecibo = dFin && dAnt ? Math.max(1, Math.floor((dFin - dAnt) / 864e5) + 1) : 0;
        const mes = String(document.getElementById('mes_principal')?.value || '').trim().toUpperCase();
        const anio = dFin ? dFin.getFullYear() : null;
        const numMedidores = parseInt(document.getElementById('num_medidores')?.value) || 0;
        const hasSinMedidor = !!document.getElementById('has_sin_medidor')?.checked;
        const numero = (v, dec = 2) => {
            const n = Number(v);
            return Number.isFinite(n) ? Number(n.toFixed(dec)) : 0;
        };
        const inquilinos = [];

        if (hasSinMedidor) {
            const c = window._i1_cache || { kwh: 0 };
            inquilinos.push({
                nombre: document.getElementById('titulo_i1')?.value || 'Inquilino sin medidor',
                id_interno: 1,
                con_medidor: false,
                kwh_real: numero(c.kwh),
                monto_pagar: numero(getVal('total_pagar_i1')),
                fecha_inicio: fechaInicioSyncLuz(fechaFin, diasRecibo),
                fecha_fin: fechaFin,
                dias_facturados: diasRecibo
            });
        }

        for (let i = 2; i <= numMedidores + 1; i++) {
            const lAnt = getVal(`lec_ant_i${i}`);
            const lAct = getVal(`lec_act_i${i}`);
            const fAnt = document.getElementById(`fec_ant_i${i}`)?.value || '';
            const fAct = document.getElementById(`fec_act_i${i}`)?.value || '';
            const da = fAnt ? parseDateLocal(fAnt) : null;
            const df = fAct ? parseDateLocal(fAct) : null;
            const diasLectura = da && df ? Math.max(1, Math.floor((df - da) / 864e5) + 1) : 0;
            const consumoMedidor = Math.max(0, lAct - lAnt);
            const consumoDiario = diasLectura > 0 ? consumoMedidor / diasLectura : 0;
            const modo = document.getElementById(`modo_dias_i${i}`)?.value || 'recibo';
            const diasFacturados = modo === 'recibo'
                ? diasRecibo
                : Math.max(0, parseInt(getVal(`dias_vividos_i${i}`)) || 0);
            const kwh = numero(consumoDiario * diasFacturados);

            inquilinos.push({
                nombre: document.getElementById(`titulo_i${i}`)?.value || `Inquilino ${i - 1}`,
                id_interno: i,
                con_medidor: true,
                kwh_real: kwh,
                monto_pagar: numero(getVal(`total_pagar_i${i}`)),
                fecha_inicio: fechaInicioSyncLuz(fechaFin, diasFacturados),
                fecha_fin: fechaFin,
                dias_facturados: diasFacturados
            });
        }

        return {
            schema: 'luz_cayran_sync',
            schema_version: '1.0',
            tipo: 'luz',
            mes,
            mes_cobro: mes,
            anio,
            periodo: { mes, anio },
            actualizado_en: new Date().toISOString(),
            inquilinos
        };
    }

    function guardarAutomaticoLuz() {
        if (restaurandoLuzLocal) return;
        try {
            localStorage.setItem(STORAGE_LUZ_BORRADOR, JSON.stringify(capturarEstadoLocalLuz()));
            localStorage.setItem(STORAGE_LUZ_SYNC, JSON.stringify(construirSyncLuz()));
        } catch (error) {
            console.warn('No se pudo guardar automáticamente Luz Cayrán:', error);
        }
    }

    function programarGuardadoAutomaticoLuz() {
        clearTimeout(timerAutosaveLuz);
        timerAutosaveLuz = setTimeout(guardarAutomaticoLuz, 250);
    }

    function restaurarAutomaticoLuz() {
        try {
            const raw = localStorage.getItem(STORAGE_LUZ_BORRADOR);
            if (!raw) return false;
            restaurandoLuzLocal = true;
            cargarEstadoLegacyLuz(JSON.parse(raw));
            return true;
        } catch (error) {
            console.warn('No se pudo restaurar automáticamente Luz Cayrán:', error);
            return false;
        } finally {
            restaurandoLuzLocal = false;
        }
    }

    function instalarAutosaveLuz() {
        document.addEventListener('input', programarGuardadoAutomaticoLuz, true);
        document.addEventListener('change', programarGuardadoAutomaticoLuz, true);
        window.addEventListener('pagehide', guardarAutomaticoLuz);
        window.addEventListener('beforeunload', guardarAutomaticoLuz);
    }

    window.addEventListener('load', () => {
        restaurarAutomaticoLuz();
        instalarAutosaveLuz();
        guardarAutomaticoLuz();
    });

    let arrayFotos = []; const MAX_FOTOS = 5;

    function manejarSeleccionFotos(event) {
        const files = Array.from(event.target.files);
        for (let file of files) {
            if (arrayFotos.length < MAX_FOTOS) { arrayFotos.push(file); } else { alert("Has alcanzado el límite máximo de 5 fotos."); break; }
        }
        dibujarGaleria(); event.target.value = ''; 
    }

    function removerFoto(index) { arrayFotos.splice(index, 1); dibujarGaleria(); }

    function dibujarGaleria() {
        const galleryUI = document.getElementById('gallery-ui'); const btnProcesar = document.getElementById('btn-procesar-ocr');
        galleryUI.innerHTML = ''; 
        arrayFotos.forEach((file, index) => {
            const url = URL.createObjectURL(file);
            const thumbWrap = document.createElement('div'); thumbWrap.className = 'thumb-wrapper';
            const img = document.createElement('img'); img.src = url;
            const delBtn = document.createElement('div'); delBtn.className = 'btn-remove-thumb'; delBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
            delBtn.onclick = () => removerFoto(index);
            thumbWrap.appendChild(img); thumbWrap.appendChild(delBtn); galleryUI.appendChild(thumbWrap);
        });
        if (arrayFotos.length < MAX_FOTOS) {
            const addBtn = document.createElement('div'); addBtn.className = 'btn-add-photo'; addBtn.innerHTML = '<i class="bi bi-plus"></i>';
            addBtn.onclick = () => document.getElementById('input_subir').click(); galleryUI.appendChild(addBtn);
        }
        btnProcesar.style.display = arrayFotos.length > 0 ? 'inline-flex' : 'none';
    }

    dibujarGaleria();

    async function procesarFotosConOCR() {
        if (arrayFotos.length === 0) return;
        const statusLabel = document.getElementById('ocr_status');
        statusLabel.style.display = 'block'; statusLabel.innerHTML = '<i class="bi bi-hourglass-split"></i> Iniciando motor de lectura OCR...';

        try {
            const worker = await Tesseract.createWorker('spa');
            let combinedText = "";
            for (let i = 0; i < arrayFotos.length; i++) {
                statusLabel.innerHTML = `<i class="bi bi-search"></i> Analizando imagen ${i + 1} de ${arrayFotos.length}...`;
                const ret = await worker.recognize(arrayFotos[i]);
                combinedText += " " + ret.data.text.toLowerCase();
            }
            
            statusLabel.innerHTML = '<i class="bi bi-gear-fill"></i> Extrayendo valores al formulario...';
            const text = combinedText;

            const buscarNumero = (regex, texto) => { const coincidencia = texto.match(regex); if (coincidencia) { const limpio = coincidencia[1].replace(/\s+/g, '').replace(',', '.'); return parseFloat(limpio); } return null; };
            const buscarFecha = (regex, texto) => { const coincidencia = texto.match(regex); if (coincidencia) { const limpio = coincidencia[1].replace(/\s+/g, ''); const partes = limpio.split(/[-/]/); if (partes.length === 3) { return partes[0].length === 4 ? `${partes[0]}-${partes[1].padStart(2,'0')}-${partes[2].padStart(2,'0')}` : `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`; } } return null; };

            const v_rep = buscarNumero(/reposic.*?mant[^0-9]*?(-?\d+\s*[.,]\s*\d{2})/i, text); const v_fijo = buscarNumero(/cargo\s*fijo[^0-9]*?(-?\d+\s*[.,]\s*\d{2})/i, text);
            const v_alum = buscarNumero(/alumbrado[^0-9]*?(-?\d+\s*[.,]\s*\d{2})/i, text); const v_int = buscarNumero(/inter[eé]s[^0-9]*?(-?\d+\s*[.,]\s*\d{2})/i, text);
            const v_red_ant = buscarNumero(/redondeo\s*mes\s*anterior[^0-9]*?(-?\d+\s*[.,]\s*\d{2})/i, text); const v_red_act = buscarNumero(/redondeo\s*mes\s*actual[^0-9]*?(-?\d+\s*[.,]\s*\d{2})/i, text);
            const v_tarifa = buscarNumero(/precio\s*de\s*s\/?\s*[^0-9]*?(-?\d+\s*[.,]\s*\d+)/i, text); 
            
            const f_act = buscarFecha(/lectura\s*actual[\s\S]{0,30}?(\d{2}\s*[-/]\s*\d{2}\s*[-/]\s*\d{4})/i, text); const f_ant = buscarFecha(/lectura\s*anterior[\s\S]{0,30}?(\d{2}\s*[-/]\s*\d{2}\s*[-/]\s*\d{4})/i, text);

            const textWithoutDates = text.replace(/\d{2}\s*[-/]\s*\d{2}\s*[-/]\s*\d{4}/g, '');
            const v_lec_act = buscarNumero(/lectura\s*actual[^0-9]*?(\d+)/i, textWithoutDates); const v_lec_ant = buscarNumero(/lectura\s*anterior[^0-9]*?(\d+)/i, textWithoutDates);

            document.getElementById('rep_m').value = v_rep !== null ? v_rep : 0; document.getElementById('cargo_fijo_m').value = v_fijo !== null ? v_fijo : 0;
            document.getElementById('alum_m').value = v_alum !== null ? v_alum : 0; document.getElementById('int_m').value = v_int !== null ? v_int : 0;
            document.getElementById('red_ant_m').value = v_red_ant !== null ? v_red_ant : 0; document.getElementById('red_act_m').value = v_red_act !== null ? v_red_act : 0;
            document.getElementById('tarifa').value = v_tarifa !== null ? v_tarifa : 0; document.getElementById('lec_act_m').value = v_lec_act !== null ? v_lec_act : 0;
            document.getElementById('lec_ant_m').value = v_lec_ant !== null ? v_lec_ant : 0;

            if (f_act !== null) document.getElementById('fec_act_m').value = f_act;
            if (f_ant !== null) document.getElementById('fec_ant_m').value = f_ant;

            calculate();
            statusLabel.style.background = 'rgba(16, 185, 129, 0.1)'; statusLabel.style.color = '#10b981';
            statusLabel.innerHTML = '<i class="bi bi-check-circle-fill"></i> ¡Lectura Exitosa! Revisa los datos en el formulario.';
            
            setTimeout(() => { statusLabel.style.display = 'none'; statusLabel.style.background = 'rgba(139, 92, 246, 0.1)'; statusLabel.style.color = 'var(--accent-main)'; }, 5000);
            await worker.terminate();

        } catch (error) {
            console.error("Error en OCR:", error);
            statusLabel.style.background = 'rgba(239, 68, 68, 0.1)'; statusLabel.style.color = '#ef4444';
            statusLabel.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> Error al procesar las imágenes.';
            setTimeout(() => { statusLabel.style.display = 'none'; }, 4000);
        }
    }
</script>
