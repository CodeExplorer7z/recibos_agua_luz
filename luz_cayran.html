<script>
    const UIT_VIGENTE = 5500;
    const container = document.getElementById('inquilinos-container');
    let currentConfirmAction = null;

    function showConfirmModal(msg, actionCallback) {
        document.getElementById('globalConfirmMsg').textContent = msg;
        currentConfirmAction = actionCallback;
        document.getElementById('globalConfirmModal').classList.add('active');
    }

    function closeGlobalConfirm() {
        document.getElementById('globalConfirmModal').classList.remove('active');
        currentConfirmAction = null;
    }

    document.getElementById('globalConfirmBtn').addEventListener('click', () => {
        if (currentConfirmAction) currentConfirmAction();
        closeGlobalConfirm();
    });

    function showAlertModal(msg, type = 'success') {
        document.getElementById('globalAlertMsg').textContent = msg;
        const iconDiv = document.getElementById('globalAlertIcon');
        const btn = document.querySelector('#globalAlertModal .btn-modal-ok');
        if (type === 'success') {
            iconDiv.className = 'custom-modal-icon icon-success';

    function cargarEstadoLegacyLuz(estado) {
        if (!estado || typeof estado !== 'object' || Array.isArray(estado)) return;
        if (estado['num_medidores'] !== undefined) document.getElementById('num_medidores').value = estado['num_medidores'];
        if (estado['has_sin_medidor'] !== undefined) document.getElementById('has_sin_medidor').checked = estado['has_sin_medidor'];
        actualizarVista();

        for (const id in estado) {
            const elemento = document.getElementById(id);
            if (elemento && id !== 'num_medidores' && id !== 'has_sin_medidor') {
                if (elemento.type === 'checkbox') elemento.checked = estado[id];
                else elemento.value = estado[id];
            }
        }
        for (let i = 2; i <= 6; i++) { if (document.getElementById(`modo_dias_i${i}`)) toggleModoDias(i, false); }
        calculate();
    }

    function cargarExportacionCompletaLuz(datos) {
        if (!Array.isArray(datos)) return;
        const metadata = datos.find(r => r && r.tipo_registro === 'metadata') || null;
        const reciboPrincipal = datos.find(r => r && r.tipo_registro === 'recibo_principal') || null;
        const inquilinos = datos.filter(r => r && r.tipo_registro === 'inquilino');
        if (!reciboPrincipal) return;

        const conMedidor = inquilinos.filter(r => r.con_medidor !== false);
        const sinMedidor = inquilinos.find(r => r.con_medidor === false) || null;

        let numMedidores = metadata && metadata.configuracion ? parseInt(metadata.configuracion.num_medidores) : conMedidor.length;
        numMedidores = Math.min(5, Math.max(1, numMedidores || 1));
        let hasSinMedidor = (metadata && metadata.configuracion && typeof metadata.configuracion.inquilino_sin_medidor === 'boolean') ? metadata.configuracion.inquilino_sin_medidor : !!sinMedidor;

        document.getElementById('num_medidores').value = String(numMedidores);
        document.getElementById('has_sin_medidor').checked = hasSinMedidor;
        actualizarVista();

        const mesImportado = (metadata && metadata.mes) || reciboPrincipal.mes || '';
        if (mesImportado) {
            const selectMes = document.getElementById('mes_principal');
            const mesNormalizado = String(mesImportado).trim().toUpperCase();
            const opcion = Array.from(selectMes.options).find(opt => opt.value.toUpperCase() === mesNormalizado);
            if (opcion) selectMes.value = opcion.value;
        }

        const lecturasM = reciboPrincipal.lecturas || {}; const importesM = reciboPrincipal.importes || {};
        asignarValorLuz('lec_ant_m', lecturasM.lectura_anterior); asignarValorLuz('lec_act_m', lecturasM.lectura_actual);
        asignarValorLuz('fec_ant_m', lecturasM.fecha_lectura_anterior || reciboPrincipal.fecha_inicio || '');
        asignarValorLuz('fec_act_m', lecturasM.fecha_lectura_actual || reciboPrincipal.fecha_fin || '');
        asignarValorLuz('tarifa', reciboPrincipal.tarifa_kwh); asignarValorLuz('rep_m', importesM.reposicion_mantenimiento);
        asignarValorLuz('cargo_fijo_m', importesM.cargo_fijo); asignarValorLuz('alum_m', importesM.alumbrado_publico);
        asignarValorLuz('int_m', importesM.interes_compensatorio); asignarValorLuz('red_ant_m', importesM.redondeo_anterior);
        asignarValorLuz('red_act_m', importesM.redondeo_actual);

        conMedidor.forEach((inq, indice) => {
            let i = parseInt(inq.id_interno);
            if (!Number.isFinite(i) || i < 2 || i > 6) i = indice + 2;
            if (i > 6) return;
            const lecturas = inq.lecturas || {};
            asignarValorLuz(`titulo_i${i}`, inq.nombre || '');
            asignarValorLuz(`lec_ant_i${i}`, lecturas.lectura_anterior); asignarValorLuz(`lec_act_i${i}`, lecturas.lectura_actual);
            asignarValorLuz(`fec_ant_i${i}`, lecturas.fecha_lectura_anterior || ''); asignarValorLuz(`fec_act_i${i}`, lecturas.fecha_lectura_actual || '');
            asignarValorLuz(`modo_dias_i${i}`, inq.modo_dias || 'recibo');
            if (inq.dias_facturados !== undefined) asignarValorLuz(`dias_vividos_i${i}`, inq.dias_facturados);
            toggleModoDias(i, false);
        });

        if (hasSinMedidor && sinMedidor) asignarValorLuz('titulo_i1', sinMedidor.nombre || '');
        calculate();
    }

                    </div>
                    <div class="input-group-custom"><label>Fecha Lectura<br>Anterior</label><input type="date" id="fec_ant_i${id}" class="filled" onchange="calculate()"></div>
                    <div class="input-group-custom"><label>Fecha Lectura<br>Actual</label><input type="date" id="fec_act_i${id}" class="filled" onchange="calculate()"></div>
                </div>
                <div class="panel-title"><i class="bi bi-calendar-check"></i> 2. Días a Cobrar</div>
                <div class="d-flex flex-column gap-3 mb-4">
                    <div class="input-group-custom">
                        <label style="color: #0ea5e9; font-weight: 800; text-transform: none; min-height: auto;">Modo de cálculo:</label>
                        <select id="modo_dias_i${id}" class="filled" onchange="toggleModoDias(${id}, true); calculate();">
                            <option value="recibo" ${modoDefault === 'recibo' ? 'selected' : ''}>Asumir días del recibo</option>
                            <option value="manual" ${modoDefault === 'manual' ? 'selected' : ''}>Escribir días manualmente</option>
                        </select>
                    </div>
                    <div class="input-group-custom">
                        <label style="color: #0ea5e9; font-weight: 800; text-transform: none; min-height: auto;">Días a Facturar (Manual):</label>
                        <input type="number" id="dias_vividos_i${id}" class="filled" disabled oninput="calculate()">
                    </div>
                </div>
                
                <div class="pdf-hidden-box">
                    <div class="input-group-custom"><input id="ener_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="rep_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="cf_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="alum_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="int_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="igv_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="aporte_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="red_ant_i${id}" readonly></div>
                    <div class="input-group-custom"><input id="red_act_i${id}" readonly></div>
                    <input type="text" id="total_pagar_i${id}" readonly value="S/. 0.00">
                </div>
            </div>
        </div>
        `;
    }

    container.innerHTML += generarTarjetaInquilino(2, "Inquilino 1", "#10b981", "recibo");
    container.innerHTML += generarTarjetaInquilino(3, "Inquilino 2", "#3b82f6", "recibo");
    container.innerHTML += generarTarjetaInquilino(4, "Inquilino 3", "#d946ef", "recibo");
    container.innerHTML += generarTarjetaInquilino(5, "Inquilino 4", "#f97316", "recibo");
    container.innerHTML += generarTarjetaInquilino(6, "Inquilino 5", "#8b5cf6", "recibo");

    container.innerHTML += `
        <div class="panel" id="recibo_i1" style="border-top: 4px solid #ef4444; display: none;">
            <div class="header-card">
                <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px;">
                    <i class="bi bi-person-fill-exclamation"></i> CLIENTE SIN MEDIDOR
                </div>
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <input type="text" id="titulo_i1" class="titulo-editable flex-grow-1" placeholder="" style="color:#ef4444; border-bottom-color:#fca5a5; min-width: 200px;">
                </div>
            </div>
            <div id="body_i1" style="display: none;">
                <input type="hidden" id="total_pagar_i1" value="S/. 0.00">
            </div>
        </div>
    `;

    function actualizarVista() {
        const inputNumMedidoresStr = document.getElementById('num_medidores').value;
        const numMedidores = inputNumMedidoresStr === '' ? 0 : (parseInt(inputNumMedidoresStr) || 0);
        const hasSinMedidor = document.getElementById('has_sin_medidor').checked;
        
        const tarjetaI1 = document.getElementById('recibo_i1');
        if (tarjetaI1) tarjetaI1.style.display = hasSinMedidor ? 'block' : 'none';
        
        for (let i = 2; i <= 6; i++) {
            const index = i - 1; 
            const debeMostrar = index <= numMedidores;
            const tarjeta = document.getElementById(`recibo_i${i}`);
            if (tarjeta) tarjeta.style.display = debeMostrar ? 'block' : 'none';
        }

        const mainContainer = document.getElementById('main-container');
        const inqContainer = document.getElementById('inquilinos-container');
        
        if (numMedidores === 0 && !hasSinMedidor) {
            mainContainer.classList.add('layout-centered');
            inqContainer.style.display = 'none';
        } else {
            mainContainer.classList.remove('layout-centered');
            inqContainer.style.display = 'grid';
        }
        calculate();
    }

    function toggleModoDias(i, enfocar = true) {
        const modo = document.getElementById(`modo_dias_i${i}`).value;
        const inputDias = document.getElementById(`dias_vividos_i${i}`);
        if (modo === 'manual') {
            inputDias.disabled = false;
            inputDias.style.borderColor = 'var(--accent-secondary)';
            inputDias.style.backgroundColor = '#fef08a';
            inputDias.style.color = '#000';
            if (enfocar) { inputDias.value = ''; inputDias.focus(); }
        } else {
            inputDias.disabled = true;
            inputDias.style.borderColor = 'transparent';
            inputDias.style.backgroundColor = 'var(--input-bg)';
            inputDias.style.color = 'var(--text-main)';
        }
    }

    function getVal(id) { 
        const el = document.getElementById(id);
        if(!el) return 0;
        let valStr = el.value.toString().replace('S/.', '').replace(',', '').trim();
        return parseFloat(valStr) || 0; 
    }
    
    function setVal(id, val, decimals = 2) { const el = document.getElementById(id); if(el) el.value = val.toFixed(decimals); }

    function calculate() {
        const factorLey = (2 * UIT_VIGENTE) / 1000000;
        const numMedidoresInput = document.getElementById('num_medidores').value;
        const numMedidores = numMedidoresInput === '' ? 0 : (parseInt(numMedidoresInput) || 0);
        const hasSinMedidor = document.getElementById('has_sin_medidor').checked;
        const totalInquilinosReales = numMedidores + (hasSinMedidor ? 1 : 0);
        const n = totalInquilinosReales > 0 ? totalInquilinosReales : 1; 
        const t = getVal('tarifa');

        const f1m_val = document.getElementById('fec_act_m').value;
        const f2m_val = document.getElementById('fec_ant_m').value;
        const d_f1m = parseDateLocal(f1m_val); const d_f2m = parseDateLocal(f2m_val);
        const dm = (d_f1m && d_f2m) ? Math.max(1, Math.floor((d_f1m - d_f2m) / 864e5) + 1) : 0;

        const km = Math.max(0, getVal('lec_act_m') - getVal('lec_ant_m'));
        const aporteLeyPrincipal = km * factorLey;
        setVal('aporte_ley_m', aporteLeyPrincipal, 2);

        const sm = getVal('rep_m') + getVal('cargo_fijo_m') + (km * t) + getVal('alum_m') + getVal('int_m');
        const totalPagarM = sm + (sm * 0.18) + aporteLeyPrincipal + getVal('red_ant_m') + getVal('red_act_m');
        document.getElementById('total_pagar_m').value = 'S/. ' + totalPagarM.toFixed(2);

        let sumaKwhInquilinosMedidorReal = 0;
        let sumaMontosInquilinosMedidor = 0;

        for (let i = 2; i <= 6; i++) {
            if ((i - 1) > numMedidores) { 
                document.getElementById(`total_pagar_i${i}`).value = 'S/. 0.00';
                continue; 
            }
            const f1i = document.getElementById(`fec_act_i${i}`).value;
            const f2i = document.getElementById(`fec_ant_i${i}`).value;
            const di_lectura = (f1i && f2i) ? Math.max(1, Math.floor((new Date(f1i+'T00:00:00') - new Date(f2i+'T00:00:00')) / 864e5) + 1) : 0;
            const ki = Math.max(0, getVal(`lec_act_i${i}`) - getVal(`lec_ant_i${i}`));
            const kd = di_lectura > 0 ? (ki / di_lectura) : 0;

            const modo = document.getElementById(`modo_dias_i${i}`).value;
            let dias_facturar = modo === 'recibo' ? dm : getVal(`dias_vividos_i${i}`);
            if (modo === 'recibo') document.getElementById(`dias_vividos_i${i}`).value = dm;
            
            sumaKwhInquilinosMedidorReal += (kd * dias_facturar);

            const en_i = (dias_facturar > 0) ? (kd * dias_facturar * t) : 0;
            const ap_i = (dias_facturar > 0) ? (kd * dias_facturar * factorLey) : 0;
            const rep_i = (dm > 0 && n > 0) ? (getVal('rep_m') / dm / n) * dias_facturar : 0;
            const cf_i = (dm > 0 && n > 0) ? (getVal('cargo_fijo_m') / dm / n) * dias_facturar : 0;
            const alum_i = (dm > 0 && n > 0) ? (getVal('alum_m') / dm / n) * dias_facturar : 0;
            const int_i = (dm > 0 && n > 0) ? (getVal('int_m') / dm / n) * dias_facturar : 0;
            const red_ant_i = (dm > 0 && n > 0) ? (getVal('red_ant_m') / dm / n) * dias_facturar : 0;
            const red_act_i = (dm > 0 && n > 0) ? (getVal('red_act_m') / dm / n) * dias_facturar : 0;

            const sub_i = en_i + rep_i + cf_i + alum_i + int_i;
            setVal(`ener_i${i}`, en_i); setVal(`rep_i${i}`, rep_i); setVal(`cf_i${i}`, cf_i);
            setVal(`alum_i${i}`, alum_i); setVal(`int_i${i}`, int_i); setVal(`igv_i${i}`, sub_i * 0.18);
            setVal(`aporte_i${i}`, ap_i); setVal(`red_ant_i${i}`, red_ant_i); setVal(`red_act_i${i}`, red_act_i);

            const total_i = sub_i + (sub_i * 0.18) + ap_i + red_ant_i + red_act_i;
            document.getElementById(`total_pagar_i${i}`).value = 'S/. ' + total_i.toFixed(2);
            sumaMontosInquilinosMedidor += total_i;
        }

        if (hasSinMedidor) {
            const kwhDiferencia = Math.max(0, km - sumaKwhInquilinosMedidorReal);
            const en_i1 = kwhDiferencia * t;
            const total_i1 = Math.max(0, totalPagarM - sumaMontosInquilinosMedidor);
            window._i1_cache = { kwh: kwhDiferencia, total: total_i1 };
            document.getElementById('total_pagar_i1').value = 'S/. ' + total_i1.toFixed(2);
        }
    }

    function cargarEstadoAppLuz(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const datos = JSON.parse(e.target.result);
                if (datos && datos.estado_app) { cargarEstadoLegacyLuz(datos.estado_app); }
                event.target.value = "";
            } catch (err) { showAlertModal("Error al leer el archivo JSON.", "error"); }
        };
        reader.readAsText(file);
    }

    window.addEventListener('load', () => {
        toggleModoDias(2, false); toggleModoDias(3, false); toggleModoDias(4, false); toggleModoDias(5, false); toggleModoDias(6, false); 
        actualizarVista(); calculate();
    });
    document.addEventListener('wheel', function(event) { if (document.activeElement.type === 'number') event.preventDefault(); }, { passive: false });
</script>
</body>
</html>
