<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CÁLCULO RECIBO AGUA</title>
    <link rel="icon" type="image/x-icon" href="recibo_agua.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { --blue-dark: #2c3e50; --blue-light: #3498db; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)) 10px; }
        
        .nav-back-bar {
            max-width: 1300px;
            margin: 0 auto 10px auto;
            padding: 0 5px;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #334155;
            color: white !important;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .main-card { border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid var(--blue-light); }
        .input-editable { background-color: #fffde7 !important; border: 1px solid #fbc02d !important; font-size: 16px !important; }
        .input-total-main { background-color: #e2f0d9 !important; border: 1px solid #70ad47 !important; font-weight: bold; color: #385723; font-size: 16px !important; }
        
        .tenant-name-input {
            border: 1px solid #fbc02d !important;
            background-color: #fffde7 !important;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            padding: 2px 5px;
            border-radius: 4px;
            color: var(--blue-dark);
        }

        .receipt-container { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; height: 100%; width: 100%; box-sizing: border-box; }
        .concept-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f1f1f1; }
        
        .total-box-web, .total-box-pdf { 
            background: var(--blue-dark); 
            color: white; 
            padding: 12px; 
            border-radius: 5px; 
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .small-label { font-size: 0.72rem; font-weight: bold; display: block; color: #555; margin-bottom: 2px; }

        .pdf-only-section { display: none; }

        .pdf-tenant-title {
            color: #3498db;
            font-weight: bold;
            font-size: 1.3rem;
            margin: 0;
        }

        .pdf-layout-fix {
            display: block !important;
            margin: 0 auto !important;
            padding: 15mm !important; 
            width: 100% !important;
            max-width: 190mm !important; 
            box-sizing: border-box !important;
        }

        .pdf-border-dashed {
            border: 2px dashed #ccc !important;
            padding: 10mm !important;
            border-radius: 5px !important;
        }

        .pdf-text-fix { font-size: 0.9rem !important; }

        @media (max-width: 768px) { .container { padding: 10px; } }
    </style>
</head>
<body>

<div class="nav-back-bar">
    <a href="./index.html" class="btn-back">&#8592; Menú Principal</a>
</div>

<div class="container py-2">
    <div class="text-center mb-4">
        <h2 class="fw-bold">CÁLCULO DE RECIBO DE AGUA</h2>
        <p class="text-muted">SISTEMA DINÁMICO DE INQUILINOS</p>
    </div>

    <div class="card main-card mb-5">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-6 col-md-2"><label class="small-label">Lectura Anterior</label><input type="number" id="m_prev_r" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Lectura Actual</label><input type="number" id="m_curr_r" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Fecha Anterior</label><input type="date" id="m_prev_d" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Fecha Actual</label><input type="date" id="m_curr_d" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Agua S/.</label><input type="number" id="v_water" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Alcantarillado</label><input type="number" id="v_sewer" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Cargo Fijo</label><input type="number" id="v_fixed" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Mora</label><input type="number" id="v_mora" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                
                <div class="col-6 col-md-2">
                    <label class="small-label text-primary">N° Inq. (Con Medidor)</label>
                    <select id="n_tenants_meter" class="form-select form-select-sm input-editable" style="font-weight: bold; border-color: #3498db !important;" onchange="render()">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                    </select>
                    <div class="form-check mt-1">
                        <input class="form-check-input" type="checkbox" id="has_nometer" checked onchange="render()">
                        <label class="form-check-label small-label" for="has_nometer">Incluir Sin Medidor</label>
                    </div>
                </div>
                
                <div class="col-6 col-md-2"><label class="small-label">Redondeo Anterior</label><input type="number" id="v_red_ant" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Redondeo Actual</label><input type="number" id="v_red_act" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                <div class="col-6 col-md-2"><label class="small-label">Total Recibo Principal</label><input type="text" id="v_total_main" class="form-control form-control-sm input-total-main" value="S/. 0.00" readonly></div>
            </div>
        </div>
    </div>

    <div class="row g-4" id="tenants_grid"></div>
</div>

<script>
    document.addEventListener('wheel', function(event) {
        if (document.activeElement.type === 'number') {
            event.preventDefault();
        }
    }, { passive: false });

    const meses = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

    function toggleMode(id) {
        const mode = document.getElementById(`i${id}_calc_mode`).value;
        const input = document.getElementById(`i${id}_manual_days`);
        if (mode === 'manual') {
            input.disabled = false;
            input.style.setProperty('background-color', '#fffde7', 'important');
        } else {
            input.disabled = true;
            input.style.setProperty('background-color', '#e9ecef', 'important');
        }
    }

    async function guardarOCompartirPDF(nombreArchivo, pdfBase64Uri) {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
            try {
                const { Filesystem, Share } = window.Capacitor.Plugins;
                const base64Data = pdfBase64Uri.split(',')[1] || pdfBase64Uri;
                const savedFile = await Filesystem.writeFile({
                    path: nombreArchivo,
                    data: base64Data,
                    directory: 'CACHE'
                });
                await Share.share({
                    title: nombreArchivo,
                    url: savedFile.uri,
                    dialogTitle: 'Abrir o Guardar Recibo PDF'
                });
                return;
            } catch (err) {
                console.error('Error con Capacitor Share:', err);
            }
        }
        const link = document.createElement('a');
        link.href = pdfBase64Uri;
        link.download = nombreArchivo;
        link.click();
    }

    function calc() {
        const getVal = (id) => parseFloat(document.getElementById(id)?.value) || 0;
        const mainDateVal = document.getElementById('m_curr_d').value;
        const mainPrevDateVal = document.getElementById('m_prev_d').value;
        let mesTexto = mainDateVal ? meses[new Date(mainDateVal + "T00:00:00").getMonth()] : "---";

        const nMetered = parseInt(document.getElementById('n_tenants_meter').value) || 1;
        const hasNoMeter = document.getElementById('has_nometer').checked;
        const totalTenants = nMetered + (hasNoMeter ? 1 : 0);

        const d = {
            mPrevD: new Date(mainPrevDateVal + "T00:00:00"),
            mCurrD: new Date(mainDateVal + "T00:00:00"),
            mPrevR: getVal('m_prev_r'), mCurrR: getVal('m_curr_r'),
            vWater: getVal('v_water'), vSewer: getVal('v_sewer'), vFixed: getVal('v_fixed'),
            vMora: getVal('v_mora'), vRedAnt: getVal('v_red_ant'), vRedAct: getVal('v_red_act'),
            nTenants: totalTenants
        };

        const mainIgv = 0.18 * (d.vWater + d.vSewer + d.vFixed);
        const totalMainBill = d.vWater + d.vSewer + d.vFixed + mainIgv + d.vMora + d.vRedAnt + d.vRedAct;
        document.getElementById('v_total_main').value = `S/. ${totalMainBill.toFixed(2)}`;

        let totalDays = 0;
        if (!isNaN(d.mCurrD) && !isNaN(d.mPrevD)) {
            totalDays = Math.floor((d.mCurrD - d.mPrevD) / 864e5) + 1;
        }
        totalDays = totalDays > 0 ? totalDays : 0;

        const diffTotal = d.mCurrR - d.mPrevR;
        const tAgua = diffTotal > 0 ? (d.vWater / diffTotal) : 0;
        const tDesague = diffTotal > 0 ? (d.vSewer / diffTotal) : 0;

        let sumWater = 0, sumSewer = 0, sumFixed = 0, sumIgv = 0, sumMora = 0, sumRedAnt = 0, sumRedAct = 0, sumCons = 0;

        for (let i = 1; i <= nMetered; i++) {
            const elPrev = document.getElementById(`i${i}_prev_r`);
            if (!elPrev) continue;

            const iPrevR = parseFloat(elPrev.value) || 0;
            const iCurrR = parseFloat(document.getElementById(`i${i}_curr_r`).value) || 0;
            const iPrevD = new Date(document.getElementById(`i${i}_prev_d`).value + "T00:00:00");
            const iCurrD = new Date(document.getElementById(`i${i}_curr_d`).value + "T00:00:00");
            
            let iDays = 0;
            if (!isNaN(iCurrD) && !isNaN(iPrevD)) {
                iDays = Math.floor((iCurrD - iPrevD) / 864e5) + 1;
            }
            
            const iDiff = iCurrR - iPrevR;
            const iDaily = (iDays > 0 && iDiff > 0) ? (iDiff / iDays) : 0;
            
            const calcMode = document.getElementById(`i${i}_calc_mode`).value;
            let billedDays = totalDays; 

            if (calcMode === 'manual') {
                const manualDaysInput = document.getElementById(`i${i}_manual_days`).value;
                billedDays = manualDaysInput !== "" ? parseFloat(manualDaysInput) : 0;
            }
            if (billedDays < 0) billedDays = 0;

            const iConsMes = iDaily * billedDays;
            let factorDias = (totalDays > 0) ? (billedDays / totalDays) : 1;

            const cWater = tAgua * iConsMes;
            const cSewer = tDesague * iConsMes;
            const cFixed = (d.vFixed / d.nTenants) * factorDias;
            const cMora = (d.vMora / d.nTenants) * factorDias;
            const cRedAnt = (d.vRedAnt / d.nTenants) * factorDias;
            const cRedAct = (d.vRedAct / d.nTenants) * factorDias;
            const cIgv = 0.18 * (cWater + cSewer + cFixed);
            
            const total = cWater + cSewer + cFixed + cIgv + cMora + cRedAnt + cRedAct;

            sumWater += cWater;
            sumSewer += cSewer;
            sumFixed += cFixed;
            sumIgv += cIgv;
            sumMora += cMora;
            sumRedAnt += cRedAnt;
            sumRedAct += cRedAct;
            sumCons += iConsMes;

            if(document.getElementById(`pdf_mes_${i}`)) document.getElementById(`pdf_mes_${i}`).innerText = mesTexto;
            if(document.getElementById(`pdf_lec_txt_${i}`)) document.getElementById(`pdf_lec_txt_${i}`).innerText = `${iPrevR.toFixed(2)} (ANT) - ${iCurrR.toFixed(2)} (ACT)`;
            if(document.getElementById(`pdf_tenant_name_${i}`)) document.getElementById(`pdf_tenant_name_${i}`).innerText = document.getElementById(`i${i}_name`).value;
            
            if(document.getElementById(`i${i}_pdf_total_val`)) {
                document.getElementById(`i${i}_pdf_total_val`).innerText = total.toFixed(2);
            }

            const safeSet = (id, val) => { if(document.getElementById(id)) document.getElementById(id).innerText = val.toFixed(2); };
            safeSet(`i${i}_res_cons`, iConsMes);
            safeSet(`i${i}_val_water`, cWater);
            safeSet(`i${i}_val_sewer`, cSewer);
            safeSet(`i${i}_val_fixed`, cFixed);
            safeSet(`i${i}_val_igv`, cIgv);
            safeSet(`i${i}_val_mora`, cMora);
            safeSet(`i${i}_val_red_ant`, cRedAnt);
            safeSet(`i${i}_val_red_act`, cRedAct);
            safeSet(`i${i}_val_total`, total);
        }

        if (hasNoMeter && document.getElementById('inometer_name')) {
            let cWater = d.vWater - sumWater; if (cWater < 0) cWater = 0;
            let cSewer = d.vSewer - sumSewer; if (cSewer < 0) cSewer = 0;
            let cFixed = d.vFixed - sumFixed; if (cFixed < 0) cFixed = 0;
            let cIgv = mainIgv - sumIgv;      if (cIgv < 0) cIgv = 0;
            let cMora = d.vMora - sumMora;    if (cMora < 0) cMora = 0;
            
            let cRedAnt = d.vRedAnt - sumRedAnt; 
            let cRedAct = d.vRedAct - sumRedAct; 
            
            let cConsMes = diffTotal - sumCons; if (cConsMes < 0) cConsMes = 0;
            
            const cTotal = cWater + cSewer + cFixed + cIgv + cMora + cRedAnt + cRedAct;

            if(document.getElementById(`pdf_mes_nometer`)) document.getElementById(`pdf_mes_nometer`).innerText = mesTexto;
            if(document.getElementById(`pdf_tenant_name_nometer`)) document.getElementById(`pdf_tenant_name_nometer`).innerText = document.getElementById(`inometer_name`).value;
            if(document.getElementById(`inometer_pdf_total_val`)) document.getElementById(`inometer_pdf_total_val`).innerText = cTotal.toFixed(2);

            const safeSet = (id, val) => { if(document.getElementById(id)) document.getElementById(id).innerText = val.toFixed(2); };
            safeSet(`inometer_res_cons`, cConsMes);
            safeSet(`inometer_val_water`, cWater);
            safeSet(`inometer_val_sewer`, cSewer);
            safeSet(`inometer_val_fixed`, cFixed);
            safeSet(`inometer_val_igv`, cIgv);
            safeSet(`inometer_val_mora`, cMora);
            safeSet(`inometer_val_red_ant`, cRedAnt);
            safeSet(`inometer_val_red_act`, cRedAct);
            safeSet(`inometer_val_total`, cTotal);
        }
    }

    function render() {
        const nMetered = parseInt(document.getElementById('n_tenants_meter').value) || 1;
        const hasNoMeter = document.getElementById('has_nometer').checked;
        const grid = document.getElementById('tenants_grid');
        
        const state = {};
        const inputs = document.querySelectorAll('#tenants_grid input, #tenants_grid select');
        inputs.forEach(inp => state[inp.id] = inp.value);

        let html = '';
        
        for(let i = 1; i <= nMetered; i++) {
            html += `
            <div class="col-lg-4 col-md-6 col-12">
                <div class="receipt-container" id="pdf_area_${i}">
                    <div id="pdf_content_wrapper_${i}">
                        <div id="pdf_header_${i}" class="pdf-only-section mb-4">
                            <h2 class="fw-bold m-0" style="color:#2c3e50; font-size: 1.5rem;">RECIBO DE AGUA</h2>
                            <p class="fw-bold mb-0">MES: <span id="pdf_mes_${i}">---</span></p>
                            <p class="pdf-tenant-title" id="pdf_tenant_name_${i}">Inquilino #${i}</p>
                        </div>

                        <div id="pdf_lecturas_${i}" class="pdf-only-section border-bottom pb-2 mb-3">
                            <span class="fw-bold" style="font-size: 0.9rem;" id="pdf_lec_txt_${i}">0.00 (ANT) - 0.00 (ACT)</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 d-print-none" id="web_header_${i}">
                            <input type="text" id="i${i}_name" class="tenant-name-input" value="Inquilino #${i}" oninput="calc()">
                            <button class="btn btn-danger btn-sm ms-2" onclick="exportPDF(${i})">PDF</button>
                        </div>

                        <div class="row g-2 mb-2 d-print-none" id="inputs_${i}">
                            <div class="col-6"><label class="small-label">Lectura Anterior</label><input type="number" id="i${i}_prev_r" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                            <div class="col-6"><label class="small-label">Lectura Actual</label><input type="number" id="i${i}_curr_r" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                            <div class="col-6"><label class="small-label">Fecha Anterior</label><input type="date" id="i${i}_prev_d" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                            <div class="col-6"><label class="small-label">Fecha Actual</label><input type="date" id="i${i}_curr_d" class="form-control form-control-sm input-editable" oninput="calc()"></div>
                            
                            <div class="col-6 mt-2 mb-2">
                                <label class="small-label text-primary">Modo de cálculo:</label>
                                <select id="i${i}_calc_mode" class="form-select form-select-sm" style="background-color: #e8f8f5; border: 1px solid #1abc9c; font-weight: bold;" onchange="toggleMode(${i}); calc()">
                                    <option value="auto">Asumir días del recibo</option>
                                    <option value="manual">Escribir días manualmente</option>
                                </select>
                            </div>
                            <div class="col-6 mt-2 mb-2">
                                <label class="small-label text-primary">Días a Facturar (Control):</label>
                                <input type="number" id="i${i}_manual_days" class="form-control form-control-sm input-editable" value="0" disabled style="background-color: #e9ecef !important;" oninput="calc()">
                            </div>
                        </div>

                        <div class="concept-item fw-bold pdf-text-fix"><span>Consumo:</span><span><span id="i${i}_res_cons">0.00</span> m³</span></div>
                        <div class="concept-item pdf-text-fix"><span>Agua</span><span><span id="i${i}_val_water">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Alcantarillado</span><span><span id="i${i}_val_sewer">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Cargo Fijo</span><span><span id="i${i}_val_fixed">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>IGV (18%)</span><span><span id="i${i}_val_igv">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Mora</span><span><span id="i${i}_val_mora">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Redondeo Anterior</span><span><span id="i${i}_val_red_ant">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Redondeo Actual</span><span><span id="i${i}_val_red_act">0.00</span></span></div>

                        <div class="total-box-web d-flex justify-content-between d-print-none" id="web_total_${i}">
                            <span>TOTAL A PAGAR</span>
                            <span class="fw-bold">S/. <span id="i${i}_val_total">0.00</span></span>
                        </div>

                        <div id="pdf_total_box_${i}" class="total-box-pdf pdf-only-section">
                            TOTAL A PAGAR: S/ <span id="i${i}_pdf_total_val">0.00</span>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        if (hasNoMeter) {
            html += `
            <div class="col-lg-4 col-md-6 col-12">
                <div class="receipt-container" id="pdf_area_nometer" style="background-color: #f4f6f7; border: 2px solid #bdc3c7;">
                    <div id="pdf_content_wrapper_nometer">
                        <div id="pdf_header_nometer" class="pdf-only-section mb-4">
                            <h2 class="fw-bold m-0" style="color:#2c3e50; font-size: 1.5rem;">RECIBO DE AGUA</h2>
                            <p class="fw-bold mb-0">MES: <span id="pdf_mes_nometer">---</span></p>
                            <p class="pdf-tenant-title" id="pdf_tenant_name_nometer">Inquilino Sin Medidor</p>
                        </div>

                        <div id="pdf_lecturas_nometer" class="pdf-only-section border-bottom pb-2 mb-3">
                            <span class="fw-bold" style="font-size: 0.9rem;" id="pdf_lec_txt_nometer">Cálculo Diferencial</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3 d-print-none" id="web_header_nometer">
                            <input type="text" id="inometer_name" class="tenant-name-input" style="background-color: #e8f8f5 !important; border-color: #1abc9c !important;" value="Inquilino Sin Medidor" oninput="calc()">
                            <button class="btn btn-danger btn-sm ms-2" onclick="exportPDF('nometer')">PDF</button>
                        </div>
                        
                        <div class="alert alert-info py-2 px-2 text-center d-print-none" style="font-size: 0.8rem; margin-bottom: 15px;">
                            <strong>Sin Medidor:</strong> Se calcula restando los consumos de los demás inquilinos al total del recibo principal.
                        </div>

                        <div class="concept-item fw-bold pdf-text-fix"><span>Consumo Estimado:</span><span><span id="inometer_res_cons">0.00</span> m³</span></div>
                        <div class="concept-item pdf-text-fix"><span>Agua</span><span><span id="inometer_val_water">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Alcantarillado</span><span><span id="inometer_val_sewer">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Cargo Fijo</span><span><span id="inometer_val_fixed">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>IGV (18%)</span><span><span id="inometer_val_igv">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Mora</span><span><span id="inometer_val_mora">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Redondeo Anterior</span><span><span id="inometer_val_red_ant">0.00</span></span></div>
                        <div class="concept-item pdf-text-fix"><span>Redondeo Actual</span><span><span id="inometer_val_red_act">0.00</span></span></div>

                        <div class="total-box-web d-flex justify-content-between d-print-none" id="web_total_nometer" style="background: #1abc9c;">
                            <span>TOTAL A PAGAR</span>
                            <span class="fw-bold">S/. <span id="inometer_val_total">0.00</span></span>
                        </div>

                        <div id="pdf_total_box_nometer" class="total-box-pdf pdf-only-section" style="background: #1abc9c;">
                            TOTAL A PAGAR: S/ <span id="inometer_pdf_total_val">0.00</span>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        grid.innerHTML = html;
        
        const newInputs = document.querySelectorAll('#tenants_grid input, #tenants_grid select');
        newInputs.forEach(inp => {
            if (state[inp.id] !== undefined) {
                inp.value = state[inp.id];
            }
        });
        
        for(let i = 1; i <= nMetered; i++) {
            if(document.getElementById(`i${i}_calc_mode`)) {
                toggleMode(i);
            }
        }
        
        calc();
    }

    async function exportPDF(id) {
        const element = document.getElementById(`pdf_area_${id}`);
        const wrapper = document.getElementById(`pdf_content_wrapper_${id}`);
        const hPdf = document.getElementById(`pdf_header_${id}`);
        const lPdf = document.getElementById(`pdf_lecturas_${id}`);
        const tPdf = document.getElementById(`pdf_total_box_${id}`);
        
        const hWeb = document.getElementById(`web_header_${id}`);
        const iWeb = document.getElementById(`inputs_${id}`);
        const tWeb = document.getElementById(`web_total_${id}`);

        hPdf.style.display = 'block';
        lPdf.style.display = 'block';
        tPdf.style.display = 'block';
        
        element.classList.add('pdf-layout-fix');
        wrapper.classList.add('pdf-border-dashed'); 
        
        if (hWeb) hWeb.style.setProperty('display', 'none', 'important');
        if (iWeb) iWeb.style.setProperty('display', 'none', 'important');
        if (tWeb) tWeb.style.setProperty('display', 'none', 'important');

        const tenantNameInput = document.getElementById(`i${id}_name`) || document.getElementById(`inometer_name`);
        const fileName = tenantNameInput ? tenantNameInput.value : 'Inquilino';

        const opt = {
            margin: [5, 5, 5, 5], 
            filename: `Recibo_${fileName}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
            const pdfBase64 = await html2pdf().set(opt).from(element).outputPdf('datauristring');
            await guardarOCompartirPDF(`Recibo_${fileName}.pdf`, pdfBase64);
        } finally {
            hPdf.style.display = 'none';
            lPdf.style.display = 'none';
            tPdf.style.display = 'none';
            
            element.classList.remove('pdf-layout-fix');
            wrapper.classList.remove('pdf-border-dashed');
            
            if (hWeb) hWeb.style.setProperty('display', 'flex', 'important');
            if (iWeb) iWeb.style.setProperty('display', 'flex', 'important');
            if (tWeb) tWeb.style.setProperty('display', 'flex', 'important');
        }
    }

    window.onload = render;
</script>
